services:
  gif:
    build: .
    container_name: mailstudio-gif
    restart: unless-stopped
    environment:
      UPLOAD_TOKEN: ${UPLOAD_TOKEN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      MAX_UPLOADS_MB: ${MAX_UPLOADS_MB:-1500}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ms_uploads:/var/www/html/uploads
      - ms_cache:/var/www/html/api/cache
      - ms_data:/var/www/html/api/data

volumes:
  ms_uploads:
  ms_cache:
  ms_data:
